<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Säveån Open World - Fiskesimulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a2421;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: #2c3e50;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #canvasContainer {
            position: relative;
            width: 100%;
            height: 450px;
            background: #111;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #uiOverlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .uiBox {
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #noticeBanner {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(192, 57, 43, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            pointer-events: none;
            z-index: 10;
        }
        #controlsPanel {
            background: #243342;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            border-top: 2px solid #34495e;
        }
        .controlGroup {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #bdc3c7;
        }
        select, button {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #455a64;
            background: #34495e;
            color: white;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        select:hover, button:hover {
            background: #455a64;
        }
        button:disabled, select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #castBtn {
            background: #27ae60;
            font-weight: bold;
            font-size: 16px;
            border: none;
        }
        #castBtn:hover:not(:disabled) {
            background: #2ecc71;
        }
        #castBtn.active {
            background: #e67e22;
        }
        #logPanel {
            background: #1c2833;
            padding: 10px 15px;
            height: 80px;
            overflow-y: auto;
            font-size: 13px;
            font-family: monospace;
            color: #aab7b8;
            border-top: 1px solid #2c3e50;
        }
        .logEntry {
            margin-bottom: 3px;
        }
        .logHighlight {
            color: #2ecc71;
        }
        .logWarn {
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="canvasContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="uiOverlay">
            <div class="uiBox" id="zoneDisplay">Zon: -</div>
            <div class="uiBox" id="flowDisplay">Vattenföring: 12 m³/s</div>
        </div>

        <div id="noticeBanner">FISKEFÖRBUD - FREDAT OMRÅDE</div>
    </div>

    <div id="controlsPanel">
        <!-- Punkt 1: Snygg dropdown-meny för zonval -->
        <div class="controlGroup">
            <label for="zoneSelect">Välj Fiskesträcka</label>
            <select id="zoneSelect">
                <!-- Fylls i dynamiskt från JS -->
            </select>
        </div>

        <!-- Punkt 3: Flugor utan parentesbeskrivningar -->
        <div class="controlGroup">
            <label for="flySelect">Välj Flugmönster</label>
            <select id="flySelect">
                <option value="pars_raka">Pärs räka</option>
                <option value="strong_medicine">Strong medicine</option>
                <option value="klinkhammer">Klinkhammer</option>
                <option value="caddis">Caddis</option>
                <option value="mickey_finn">Mickey Finn</option>
                <option value="glodhack">Glödhäck</option>
            </select>
        </div>

        <div class="controlGroup">
            <label for="rodSelect">Utrustning</label>
            <select id="rodSelect">
                <option value="6">Klass #6 (Öring/Harr)</option>
                <option value="8" selected>Klass #8 (Lax/Havsöring)</option>
            </select>
        </div>

        <div class="controlGroup" style="justify-content: flex-end;">
            <button id="castBtn">KASTA UT</button>
        </div>
    </div>

    <div id="logPanel" id="gameLog">
        <div class="logEntry">Välkommen till Säveån Open World. Välj zon och fluga för att börja.</div>
    </div>
</div>

<script>
// --- ZONDATA (Inkluderar ändringarna 2, 4 och 5) ---
const ZONES = {
    ingvarssons: {
        name: "Ingvarssons", // Punkt 4: Ändrat från Finngösagrundet
        fishable: true,
        flowDirection: 1, // Vänster till höger (standard)
        description: "Klassisk sträcka med fin ström och ståndplatser för lax.",
        bgColors: ["#1e3c72", "#2a5298"]
    },
    mannered: {
        name: "Mannered (Sandbanken)", // Punkt 2: Sanden vid Mannered tillagd
        fishable: true,
        flowDirection: 1,
        description: "Långgrund sandbank. Utmärkt ståplats för vadfiske.",
        bgColors: ["#134e5e", "#71b280"]
    },
    jonsered_kraftverk: {
        name: "Jonsereds Kraftverk", // Punkt 5: Illustrerad sträcka med fiskeförbud
        fishable: false,
        flowDirection: -1, // Vattnet flyter tvärtom: Höger till Vänster
        description: "Fredat område nedanför kraftverket och laxtrappan. Fiskeförbud råder.",
        bgColors: ["#2c3e50", "#000000"]
    }
};

// Game State
let currentZoneKey = "ingvarssons";
let isCasting = false;
let waterFlow = 12.5; // m³/s
let particles = [];

// DOM Elements
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const zoneSelect = document.getElementById("zoneSelect");
const flySelect = document.getElementById("flySelect");
const rodSelect = document.getElementById("rodSelect");
const castBtn = document.getElementById("castBtn");
const zoneDisplay = document.getElementById("zoneDisplay");
const flowDisplay = document.getElementById("flowDisplay");
const noticeBanner = document.getElementById("noticeBanner");
const logPanel = document.getElementById("logPanel");

// Initiera canvas-storlek
function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    initParticles();
}
window.addEventListener("resize", resizeCanvas);

// Initiera Dropdown för Zoner (Punkt 1)
function initZoneDropdown() {
    zoneSelect.innerHTML = "";
    Object.keys(ZONES).forEach(key => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = ZONES[key].name;
        zoneSelect.appendChild(opt);
    });
    zoneSelect.value = currentZoneKey;
}

// Byt Zon
function changeZone(zoneKey) {
    currentZoneKey = zoneKey;
    const zone = ZONES[zoneKey];
    
    zoneDisplay.textContent = `Zon: ${zone.name}`;
    addLog(`Bytte zon till ${zone.name}.`);

    if (!zone.fishable) {
        // Hantering av fredat område (Punkt 5)
        noticeBanner.style.display = "block";
        castBtn.disabled = true;
        castBtn.textContent = "FISKEFÖRBUD";
        if (isCasting) stopCast();
        addLog(`VARNING: ${zone.description}`, "logWarn");
    } else {
        noticeBanner.style.display = "none";
        castBtn.disabled = false;
        castBtn.textContent = "KASTA UT";
    }

    initParticles();
}

// Loggsystem
function addLog(msg, type = "") {
    const div = document.createElement("div");
    div.className = `logEntry ${type}`;
    div.textContent = `> ${msg}`;
    logPanel.appendChild(div);
    logPanel.scrollTop = logPanel.scrollHeight;
}

// Partikelsystem för vattenströmning
function initParticles() {
    particles = [];
    const numParticles = 60;
    for (let i = 0; i < numParticles; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            speed: (1 + Math.random() * 2) * (waterFlow / 10),
            length: 10 + Math.random() * 20
        });
    }
}

function updateParticles() {
    const zone = ZONES[currentZoneKey];
    const dir = zone.flowDirection; // 1 = Höger, -1 = Vänster (Punkt 5)

    particles.forEach(p => {
        p.x += p.speed * dir;

        if (dir === 1 && p.x > canvas.width) {
            p.x = -p.length;
            p.y = Math.random() * canvas.height;
        } else if (dir === -1 && p.x < -p.length) {
            p.x = canvas.width + p.length;
            p.y = Math.random() * canvas.height;
        }
    });
}

function draw() {
    const zone = ZONES[currentZoneKey];

    // Bakgrunds-gradient
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, zone.bgColors[0]);
    grad.addColorStop(1, zone.bgColors[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Rita vattenströmning
    ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
    ctx.lineWidth = 2;
    particles.forEach(p => {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + (p.length * zone.flowDirection), p.y);
        ctx.stroke();
    });

    // Specialgrafik för Kraftverket (Illustrations-indikation)
    if (currentZoneKey === "jonsered_kraftverk") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.fillRect(0, 0, 180, canvas.height);
        
        ctx.fillStyle = "#7f8c8d";
        ctx.font = "14px sans-serif";
        ctx.fillText("Kraftverksdamm & Laxtrappa", 10, 30);
        
        // Rita enkel Laxtrappa-illustration
        ctx.strokeStyle = "#95a5a6";
        ctx.lineWidth = 3;
        for (let i = 0; i < 5; i++) {
            ctx.strokeRect(20, 60 + (i * 35), 60, 25);
        }
    }

    // Rita kastlina om aktiverat
    if (isCasting && zone.fishable) {
        ctx.strokeStyle = "#f1c40f";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, canvas.height);
        ctx.quadraticCurveTo(canvas.width / 2 + 50, canvas.height / 2, canvas.width / 2 + 100, canvas.height / 3);
        ctx.stroke();

        // Flugan
        ctx.fillStyle = "#e74c3c";
        ctx.beginPath();
        ctx.arc(canvas.width / 2 + 100, canvas.height / 3, 5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function gameLoop() {
    updateParticles();
    draw();
    requestAnimationFrame(gameLoop);
}

// Kastmekanik
function toggleCast() {
    const zone = ZONES[currentZoneKey];
    if (!zone.fishable) return;

    if (!isCasting) {
        isCasting = true;
        castBtn.textContent = "VEVA IN";
        castBtn.classList.add("active");
        const selectedFly = flySelect.options[flySelect.selectedIndex].text;
        addLog(`Kastade ut med ${selectedFly}.`, "logHighlight");
    } else {
        stopCast();
        addLog("Vevade in linan.");
    }
}

function stopCast() {
    isCasting = false;
    castBtn.textContent = "KASTA UT";
    castBtn.classList.remove("active");
}

// Event Listeners
zoneSelect.addEventListener("change", (e) => changeZone(e.target.value));
castBtn.addEventListener("click", toggleCast);

// Initiering
resizeCanvas();
initZoneDropdown();
changeZone(currentZoneKey);
gameLoop();
</script>

</body>
</html>
