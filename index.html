<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Säveån Fly Fishing</title>
    <style>
        :root {
            --primary-color: #2c5e3b;
            --accent-color: #4a7c59;
            --bg-color: #1a1a1a;
            --text-color: #f4f4f4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--primary-color);
            padding: 10px 15px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            overflow-y: auto;
        }

        /* Meny- och sektionssystem */
        .menu-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            flex: 1;
        }

        .menu-card {
            background: linear-gradient(135deg, #2c5e3b, #1e3f26);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .menu-card:active {
            transform: scale(0.98);
        }

        .menu-card h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .menu-card p {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Spelyta */
        #game-screen {
            display: none;
            flex-direction: column;
            flex: 1;
            gap: 10px;
        }

        .stats-bar {
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .canvas-container {
            flex: 1;
            background: #0f2e1b;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--accent-color);
            min-height: 200px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
        }

        .btn-secondary {
            background: #444;
        }

        /* Anpassning för liggande skärm (Landscape) utan scroll */
        @media (orientation: landscape) {
            body {
                flex-direction: row;
                flex-wrap: wrap;
            }
            header {
                width: 100%;
                padding: 6px;
                font-size: 1rem;
            }
            main {
                flex-direction: row;
                max-width: 100%;
                height: calc(100vh - 40px);
                height: calc(100dvh - 40px);
            }
            .menu-container {
                grid-template-columns: repeat(3, 1fr);
            }
            #game-screen {
                flex-direction: row;
            }
            .canvas-container {
                flex: 2;
            }
            .side-panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <header>Säveån Fly Fishing</header>

    <main>
        <!-- Huvudmeny -->
        <div id="main-menu" class="menu-container">
            <div class="menu-card" onclick="startSection('fishing')">
                <div>
                    <h2>Fiska i Säveån</h2>
                    <p>Utforska Dickson, Mannered och Lorthöljan.</p>
                </div>
                <span style="font-size: 1.5rem; margin-top: 10px;">🎣</span>
            </div>
            
            <div class="menu-card" onclick="startSection('biotope')">
                <div>
                    <h2>Biotopvård</h2>
                    <p>Åtgärder för lax, öring och strömvattenmiljö.</p>
                </div>
                <span style="font-size: 1.5rem; margin-top: 10px;">🌿</span>
            </div>

            <div class="menu-card" onclick="startSection('weather')">
                <div>
                    <h2>Väder & Vatten</h2>
                    <p>Aktuell prognos och flöde via Open-Meteo.</p>
                </div>
                <span style="font-size: 1.5rem; margin-top: 10px;">⛅</span>
            </div>
        </div>

        <!-- Spelskärm / Aktiv sektion (Dold från start) -->
        <div id="game-screen">
            <div class="canvas-container">
                <canvas id="simCanvas"></canvas>
            </div>
            <div class="side-panel" style="display: flex; flex-direction: column; gap: 10px; justify-content: center;">
                <div class="stats-bar">
                    <span id="stat-info">Flugval: Torrfluga</span>
                    <span id="stat-score">Fångst: 0</span>
                </div>
                <button class="btn" onclick="castLine()">Kasta kast</button>
                <button class="btn btn-secondary" onclick="returnToMenu()">Tillbaka till meny</button>
            </div>
        </div>
    </main>

    <script>
        function startSection(type) {
            document.getElementById('main-menu').style.display = 'none';
            const gameScreen = document.getElementById('game-screen');
            gameScreen.style.display = 'flex';
            
            if(type === 'biotope') {
                document.getElementById('stat-info').innerText = 'Biotopvård aktiv';
            } else if(type === 'weather') {
                document.getElementById('stat-info').innerText = 'Hämtar väder...';
            } else {
                document.getElementById('stat-info').innerText = 'Fluga: Följare';
            }
            
            resizeCanvas();
        }

        function returnToMenu() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('main-menu').style.display = 'grid';
        }

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);

        function castLine() {
            // Enkel animation eller händelse för kast
            ctx.fillStyle = '#143d22';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#68d391';
            ctx.font = '16px sans-serif';
            ctx.fillText("Kast lagt i strömmen...", 20, 30);
        }
    </script>
</body>
</html>
